<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Runefall Menu</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0a08; color: #e8ddc6; font: 14px/1.5 "Segoe UI", sans-serif; }
    #menu { max-width: 760px; margin: 8vh auto; border: 1px solid #8a6a2f; background: #15110c; border-radius: 8px; overflow: hidden; }
    nav { display: flex; border-bottom: 1px solid #3a2e1e; }
    nav button { flex: 1; padding: 12px; background: #1d1710; color: #c8bda5; border: 0; cursor: pointer; }
    nav button.active { background: #2a2118; color: #f0c96b; }
    section { padding: 18px 22px; display: none; }
    section.active { display: block; }
    h2 { color: #f0c96b; font-size: 16px; margin: 0 0 10px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 18px; }
    .muted { color: #a89b82; }
    ul { margin: 0; padding-left: 18px; }
  </style>
</head>
<body>
  <div id="menu">
    <nav>
      <button data-tab="character" class="active">Character</button>
      <button data-tab="skills">Skills</button>
      <button data-tab="gear">Gear</button>
      <button data-tab="codex">Codex</button>
    </nav>
    <section id="character" class="active"><h2>Character</h2><div id="character-body" class="grid"></div></section>
    <section id="skills"><h2>Skills</h2><div id="skills-body"></div></section>
    <section id="gear"><h2>Gear</h2><div id="gear-body"></div></section>
    <section id="codex"><h2>Anomaly Codex</h2><div id="codex-body"></div></section>
  </div>
  <script>
    const names = ['Might','Endurance','Precision','Agility','Guile','Cunning','Intellect','Wisdom','Willpower'];
    async function load() {
      try {
        const response = await fetch('../Runefall/ui/menu-model.json', { cache: 'no-store' });
        if (!response.ok) return;
        const model = await response.json();
        const c = model.character || {};
        document.getElementById('character-body').innerHTML =
          '<div>Rank ' + (c.rank || 1) + '</div><div class="muted">' + (c.classId || 'no class') + '</div>' +
          '<div>XP ' + (c.xp || 0) + ' / ' + (c.xpToNext || 100) + '</div><div>Points ' + (c.attributePoints || 0) + ' attr / ' + (c.skillPoints || 0) + ' skill</div>' +
          (c.attributes || []).map((value, index) => '<div class="muted">' + names[index] + ' ' + value + '</div>').join('');
        const skills = model.skills || [];
        document.getElementById('skills-body').innerHTML = skills.length
          ? '<ul>' + skills.map(s => '<li>' + s.skill + ' — rank ' + s.rank + '</li>').join('') + '</ul>'
          : '<p class="muted">No skill ranks yet.</p>';
        const gear = model.gear || {};
        document.getElementById('gear-body').innerHTML = '<p>Rune items: ' + (gear.items || 0) + '</p><p class="muted">Runes: ' + (gear.runes || []).join(' / ') + '</p>';
        const anomalies = (model.codex || {}).anomalies || [];
        document.getElementById('codex-body').innerHTML = anomalies.length
          ? '<ul>' + anomalies.map(a => '<li>' + a.family + ' — core ' + a.core + ', trophy ' + a.trophy + ', +' + a.stageOffset + ' stages</li>').join('') + '</ul>'
          : '<p class="muted">No anomaly data.</p>';
      } catch (error) {
        // PrismaUI host absent: menu stays closed; base game UI remains usable.
      }
    }
    document.querySelectorAll('nav button').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b === button));
        document.querySelectorAll('section').forEach(s => s.classList.toggle('active', s.id === button.dataset.tab));
      });
    });
    load();
    setInterval(load, 1500);
  </script>
</body>
</html>
